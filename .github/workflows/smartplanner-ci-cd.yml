
name: SmartPlanner CI/CD

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'

  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:

  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p deploy-package

          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No executable JAR found!"
            ls -lah target/
            exit 1
          fi

          echo "Found JAR: $JAR_FILE"

          cp "$JAR_FILE" deploy-package/app.jar

          echo "Deployment package:"
          ls -lah deploy-package/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartplanner-jar
          path: deploy-package/app.jar
          if-no-files-found: error
          retention-days: 1


  deploy:
    name: Deploy to Azure
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: smartplanner-jar
          path: ./deploy-package

      - name: Verify deployment package
        run: |
          echo "Checking deployment package..."
          ls -lah ./deploy-package/
          test -f ./deploy-package/app.jar

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy-package/app.jar
